<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Shop Timer System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">CS</span>
      <div>
        <input id="shopName" class="shop-name" maxlength="28" aria-label="Shop name">
        <p>Timer System</p>
      </div>
    </div>
    <time id="clock" class="clock"></time>
  </header>

  <main class="layout">
    <div class="main-col">
      <section class="hero" aria-label="Today's performance">
        <div class="hero-top">
          <div class="revenue">
            <span>Today's revenue</span>
            <strong id="statIncome"></strong>
          </div>
          <dl class="kpis">
            <div><dt>Sessions</dt><dd id="statSessions"></dd></div>
            <div><dt>In use</dt><dd id="statActive"></dd></div>
            <div><dt>Avg. per session</dt><dd id="statAverage"></dd></div>
          </dl>
        </div>
        <div class="chart" role="img" aria-label="Revenue by hour">
          <div id="bars" class="bars"></div>
          <div class="axis"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>11 PM</span></div>
        </div>
      </section>

      <section aria-labelledby="stationsTitle">
        <div class="section-head">
          <div>
            <h2 id="stationsTitle">Workstations</h2>
            <p class="hint">Insert a coin to start or extend a session.</p>
          </div>
          <form id="settings" class="rate">
            <label for="ratePerHour">Rate per hour</label>
            <div class="money"><i>&#8369;</i><input id="ratePerHour" type="number" min="1" step="1" required></div>
            <p id="rateHint" class="hint"></p>
          </form>
        </div>
        <div id="stationGrid" class="station-grid"></div>
      </section>
    </div>

    <aside class="rail">
      <section class="card" aria-labelledby="activityTitle">
        <div class="card-head">
          <h2 id="activityTitle">Activity</h2>
          <button id="clearLog" class="link" type="button">Clear</button>
        </div>
        <ul id="activity" class="activity"></ul>
        <p id="activityEmpty" class="empty">No coins inserted yet today.</p>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toastMessage"></span>
    <button id="toastUndo" type="button">Undo</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
